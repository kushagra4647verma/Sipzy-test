name: sipzy
description: A beverage discovery and rating platform
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management & Navigation
  go_router: ^14.0.0

  # HTTP & API
  http: ^1.2.0
  supabase_flutter: ^2.5.0

  # Utilities
  url_launcher: ^6.2.0
  image_picker: ^1.0.7
  shared_preferences: ^2.2.2
  # UI
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # If you have assets, uncomment and configure:
  # assets:
  #   - assets/images/
  #   - assets/icons/
